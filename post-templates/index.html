<title>Templates de Post Gov Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Reddit+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --purple: #613EFF; --navy: #0A005A; --magenta: #EF41FF; --pink: #F9006F; --peach: #FFE7E1;
    --ui-bg: #F4F2F8; --ui-panel: #FFFFFF; --ui-text: #1B1533; --ui-muted: #6A6483; --ui-line: #DDD8EA;
    --ui-accent: #613EFF; --ui-accent-text: #FFFFFF; --ui-chip: #ECE8F7; --ui-shadow: 0 6px 24px rgba(10,0,90,.10);

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ui-bg: #14101F; --ui-panel: #1E1830; --ui-text: #F1EEF9; --ui-muted: #A9A2C4; --ui-line: #2E2745;
      --ui-accent: #8C71FF; --ui-accent-text: #0A005A; --ui-chip: #2A2340; --ui-shadow: 0 6px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --ui-bg: #14101F; --ui-panel: #1E1830; --ui-text: #F1EEF9; --ui-muted: #A9A2C4; --ui-line: #2E2745;
    --ui-accent: #8C71FF; --ui-accent-text: #0A005A; --ui-chip: #2A2340; --ui-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body { background: var(--ui-bg); color: var(--ui-text); font-family: var(--font-ui); font-size: 15px; padding-inline: 16px; padding-block: 0 48px; }
  a { color: inherit; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ui-bg); margin-inline: -16px; padding: 16px 16px 12px; border-bottom: 1px solid var(--ui-line); }
  .top__row { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; max-width: 1480px; margin: 0 auto; }
  .top h1 { font-family: var(--font-head); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 22px; margin: 0; line-height: 1; }
  .top p { margin: 4px 0 0; color: var(--ui-muted); font-size: 13.5px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 12px; max-width: 1480px; margin-inline: auto; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .group > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ui-muted); margin-right: 4px; font-weight: 600; }
  .group button, .toggle { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ui-line); background: var(--ui-panel); color: var(--ui-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .group button[aria-pressed="true"] { background: var(--ui-accent); color: var(--ui-accent-text); border-color: var(--ui-accent); }
  .group button:focus-visible, .toggle:focus-visible, .tile:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
  .toggle input { accent-color: var(--ui-accent); margin: 0; }
  .count { font-size: 13px; color: var(--ui-muted); margin-left: auto; align-self: center; font-variant-numeric: tabular-nums; }

  main { max-width: 1480px; margin: 20px auto 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px 18px; }
  .tile { background: var(--ui-panel); border-radius: 12px; box-shadow: var(--ui-shadow); padding: 10px; cursor: zoom-in; border: 0; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 8px; }
  .tile__frame { width: 100%; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 6px; position: relative; }
  .tile__frame .post { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--s, .25)); }
  .tile__meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .tile__meta b { font-weight: 700; }
  .tile__meta span { color: var(--ui-muted); font-size: 12px; }
  .empty { padding: 60px 16px; text-align: center; color: var(--ui-muted); }

  /* modal */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,0,30,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .modal__frame { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal__frame .post { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .modal__bar { display: flex; gap: 12px; align-items: center; color: #fff; font-size: 14px; flex-wrap: wrap; justify-content: center; }
  .modal__bar button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; cursor: pointer; }
  .modal__bar b { font-weight: 700; }

  /* ===== quadro 1080×1350 (mesma base do social-posts.md) ===== */
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  .post .shape { position: absolute; display: block; }
  .post__h1 { margin: 0; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; line-height: 1.04; letter-spacing: .005em; }
  .post__p { margin: 0; font-size: 34px; line-height: 1.45; text-align: justify; hyphens: none; overflow-wrap: normal; }
  .post__counter { position: absolute; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .post__label { position: absolute; top: 80px; height: 96px; display: flex; align-items: center; font-family: var(--font-head); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 30px; }
  .post__label--left { left: 0; padding: 0 44px 0 88px; border-radius: 0 48px 48px 0; }
  .post__label--right { right: 0; padding: 0 88px 0 44px; border-radius: 48px 0 0 48px; }
  .post__bottom { position: absolute; left: 88px; right: 88px; bottom: 72px; height: 44px; display: flex; align-items: center; font-size: 24px; gap: 40px; }
  .post__bottom img { height: 44px; width: auto; display: block; }
  .post__hint { font-weight: 500; display: inline-flex; align-items: center; gap: 12px; }
  .post__content { position: absolute; display: flex; flex-direction: column; }
  .chip { border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chip img { width: 62%; height: auto; }
  .card { border-radius: 24px; background: #fff; display: flex; flex-direction: column; gap: 18px; padding: 28px; }
  .card__title { font-size: 31px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .card__desc { font-size: 25px; line-height: 1.35; color: #2D3748; text-align: justify; hyphens: none; overflow-wrap: normal; }
  .post .zone { position: absolute; border: 4px dashed rgba(0,0,0,.35); border-radius: 12px; pointer-events: none; }
  .post--light .zone { border-color: rgba(10,0,90,.45); }
  .post--dark .zone { border-color: rgba(255,255,255,.55); }
  .gallery--no-text .post .txt { visibility: hidden; }
  .gallery--no-zones .post .zone { display: none; }
  @media (prefers-reduced-motion: no-preference) { .tile { transition: transform .15s ease; } .tile:hover { transform: translateY(-2px); } }
</style>

<header class="top">
  <div class="top__row">
    <div>
      <h1>Templates de post Gov Hub</h1>
      <p>1080×1350 · 5 estruturas × 4 composições × 5 fundos. Clique num quadro para ampliar; ← → navegam.</p>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="filters">
    <div class="group" id="f-struct"><span>Estrutura</span></div>
    <div class="group" id="f-bg"><span>Fundo</span></div>
    <div class="group" id="f-comp"><span>Composição</span></div>
    <div class="group">
      <label class="toggle"><input type="checkbox" id="t-text" checked> Texto de exemplo</label>
      <label class="toggle"><input type="checkbox" id="t-zones"> Zonas de texto</label>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nenhum quadro com esses filtros.</div>
</main>

  const ARROW = (s, stroke) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>`;

    return `<div class="post__bottom" style="justify-content:space-between; color:${bg.text};"><div style="display:flex; gap:40px; align-items:center;">${logo}${counter}</div>${hint}</div>`;
  }
  function counterHTML(bg, comp, n) {
    if (comp.counter !== 'tr') return '';
    return `<div class="post__counter" style="right:88px; top:104px; color:${bg.text};">${n}</div>`;
  }
  function labelHTML(bg, comp, text) {
    if (!comp.label || comp.label === 'none') return '';
    const [fill, tx] = bg.label;
    return `<div class="post__label post__label--${comp.label} txt" style="background:${C[fill]}; color:${C[tx]};">${text}</div>`;
  }

  const R = {
    capa(bg, comp) {
      const z = comp.zone;
      const logo = comp.logo === 'tl' ? `<div style="position:absolute; left:${z.x}px; top:96px;">${logoImg(bg, 80)}</div>`
        : comp.logo === 'tr' ? `<div style="position:absolute; right:88px; top:96px;">${logoImg(bg, 80)}</div>` : '';
      return logo + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:36px;">
        <h1 class="post__h1 txt" style="font-size:112px; color:${bg.text};">Chamada da capa em duas linhas.</h1>
        <p class="post__p txt" style="font-size:36px; max-width:700px; color:${bg.muted};">Texto de apoio em duas ou três linhas, dizendo do que se trata a peça.</p>
      </div>` + bottomBar(bg, comp, { logo: comp.logo === 'bottom', n: '01/07' });
    },
    conteudo(bg, comp) {
      const z = comp.zone, t = comp.title;
      const card = (title) => `<div class="card txt">${chipHTML(BG.peach, 96)}<div class="card__title">${title}</div><div class="card__desc">Descrição em até três linhas, discreta e justificada.</div></div>`;
      return labelHTML(bg, comp, 'Rótulo da seção') + counterHTML(bg, comp, '02/07') + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:28px;">
        <div style="margin-left:${t.ml}px; max-width:${t.maxW}px; min-height:${t.minH}px; display:flex; align-items:flex-end;"><h1 class="post__h1 txt" style="font-size:66px; color:${bg.text};">Título forte em até três linhas.</h1></div>
        <p class="post__p txt" style="font-size:33px; color:${bg.muted};">Descrição discreta e justificada, de três a quatro linhas, com o texto original do briefing que explica o assunto do quadro.</p>
        <div class="txt" style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px; margin-top:8px;">${card('Título do card')}${card('Título do card')}</div>
      </div>` + bottomBar(bg, comp, { logo: true, n: '02/07' });
    },
    enfase(bg, comp) {
      const z = comp.zone;
      if (comp.numeral) {
        return counterHTML(bg, comp, '04/07') + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:24px; align-items:center; text-align:center;">
          <div class="txt" style="font-family:var(--font-head); font-weight:700; font-size:190px; line-height:1; color:${C[bg.numeral]};">87%</div>
          <h1 class="post__h1 txt" style="font-size:58px; color:${bg.text}; max-width:640px;">Frase curta que dá sentido ao número.</h1>
        </div>` + bottomBar(bg, comp, { logo: false, n: '04/07' });
      }
      return counterHTML(bg, comp, '04/07') + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:40px;">
        ${chipHTML(bg, comp.chip, 28)}
        <h1 class="post__h1 txt" style="font-size:62px; color:${bg.text}; max-width:860px;">Pergunta-gancho ou frase de impacto em até quatro linhas?</h1>
        <p class="post__p txt" style="max-width:620px; color:${bg.muted};">Apoio de uma ou duas linhas que reforça a dor.</p>
      </div>` + bottomBar(bg, comp, { logo: false, n: '04/07' });
    },
    convite(bg, comp) {
      const z = comp.zone, [ctaBg, ctaTx] = bg.cta;
      return labelHTML(bg, comp, 'Vamos conversar') + counterHTML(bg, comp, '06/07') + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:32px;">
        ${chipHTML(bg, 128)}
        <h1 class="post__h1 txt" style="font-size:66px; color:${bg.text}; max-width:${comp.h1w}px;">Chamada do convite em até três linhas?</h1>
        <p class="post__p txt" style="max-width:560px; color:${bg.muted};">Apoio de duas linhas convidando ao contato.</p>
        <div class="txt" style="display:flex; flex-direction:column; gap:22px; margin-top:8px;">
          <div style="display:inline-flex; align-items:center; gap:16px; align-self:flex-start; padding:24px 40px; border-radius:999px; background:${C[ctaBg]}; color:${ctaTx}; font-size:30px; font-weight:700;">Fale com a gente ${ARROW(30, ctaTx)}</div>
          <div style="display:flex; flex-direction:column; gap:6px;"><span style="font-size:30px; font-weight:700; color:${bg.text};">gov-hub.io</span><span style="font-size:26px; font-weight:500; color:${bg.muted};">caguiar@unb.br</span></div>
        </div>
      </div>` + bottomBar(bg, comp, { logo: false, n: '06/07' });
    },
    fechamento(bg, comp) {
      const z = comp.zone;
      const partners = bg.logo === 'white' ? ['lab-livre-white', 'unb-light'] : ['lab-livre-blue', 'unb-dark'];
      return counterHTML(bg, comp, '07/07') + `<div class="post__content" style="left:${z.x}px; width:${z.w}px; top:${z.y}px; gap:28px; align-items:center; text-align:center;">
        ${logoImg(bg, 112)}
        <div class="txt" style="font-size:40px; font-weight:700; color:${bg.text};">gov-hub.io</div>
        <div class="txt" style="font-family:var(--font-head); font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:34px; color:${bg.muted};">Tagline da marca.</div>
      </div>
      <div style="position:absolute; left:88px; right:88px; top:1000px; display:flex; flex-direction:column; align-items:center; gap:28px;">
        <div class="txt" style="font-size:22px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:${bg.muted};">Uma iniciativa de</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:48px;"><img src="logo/${partners[0]}.svg" alt="Lab Livre" style="height:60px; width:auto;"><img src="logo/${partners[1]}.svg" alt="UnB" style="height:60px; width:auto;"></div>
      </div>`;
    },
  };

  function postHTML(structId, compId, bgId, extraStyle, opts) {
    const bg = BG[bgId], comp = COMPS[structId][compId], o = opts || {};
    return `<div class="post ${bg.dark ? 'post--light' : 'post--dark'}" lang="pt-BR" style="background:${C[bgId]}; color:${bg.text}; ${extraStyle || ''}">`
      + comp.shapes.map(s => shapeHTML(s, bg)).join('')
      + R[structId](bg, comp)
      + (o.zone === false ? '' : zoneHTML(comp.zone))
      + `</div>`;
  }
  // @spec-end

  // ---- catálogo
  const items = [];
  for (const s of STRUCTS) for (const compId of ['A', 'B', 'C', 'D']) for (const bgId of BG_ORDER) {
    items.push({ id: `${s.id}-${compId}-${bgId}`, struct: s.id, structName: s.name, comp: compId, bg: bgId, desc: COMPS[s.id][compId].desc });
  }

  // ---- filtros (persistidos por viewer, só conveniência)
  const state = { struct: 'all', bg: 'all', comp: 'all', text: true, zones: false };
  try { Object.assign(state, JSON.parse(localStorage.getItem('gh-post-gallery') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('gh-post-gallery', JSON.stringify(state)); } catch (e) {} };

  function buildGroup(el, key, options) {
    const all = document.createElement('button'); all.type = 'button'; all.textContent = 'Todos'; all.dataset.v = 'all'; el.appendChild(all);
    for (const o of options) {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.v = o.v;
      b.innerHTML = (o.color ? `<i class="swatch" style="background:${o.color}"></i>` : '') + o.label; el.appendChild(b);
    }
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v; save(); sync(); });
  }
  buildGroup(document.getElementById('f-struct'), 'struct', STRUCTS.map(s => ({ v: s.id, label: s.name })));
  buildGroup(document.getElementById('f-bg'), 'bg', BG_ORDER.map(b => ({ v: b, label: NAME[b], color: C[b] })));
  buildGroup(document.getElementById('f-comp'), 'comp', [{ v: 'A', label: 'A (atual)' }, { v: 'B', label: 'B' }, { v: 'C', label: 'C' }, { v: 'D', label: 'D' }]);
  const tText = document.getElementById('t-text'), tZones = document.getElementById('t-zones');
  tText.checked = state.text; tZones.checked = state.zones;
  tText.addEventListener('change', () => { state.text = tText.checked; save(); sync(); });
  tZones.addEventListener('change', () => { state.zones = tZones.checked; save(); sync(); });

  const grid = document.getElementById('grid'), empty = document.getElementById('empty'), count = document.getElementById('count');
  let visible = [];
  function sync() {
    for (const [key, id] of [['struct', 'f-struct'], ['bg', 'f-bg'], ['comp', 'f-comp']]) {
      document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[key])));
    }
    document.body.classList.toggle('gallery--no-text', !state.text);
    document.body.classList.toggle('gallery--no-zones', !state.zones);
    visible = items.filter(i => (state.struct === 'all' || i.struct === state.struct) && (state.bg === 'all' || i.bg === state.bg) && (state.comp === 'all' || i.comp === state.comp));
    grid.innerHTML = visible.map((i, idx) => `<div class="tile" role="button" tabindex="0" data-idx="${idx}" aria-label="Ampliar ${i.structName} ${i.comp} ${NAME[i.bg]}">
      <div class="tile__frame">${postHTML(i.struct, i.comp, i.bg)}</div>
      <div class="tile__meta"><b>${i.structName} · ${i.comp}</b><span>${NAME[i.bg]}</span></div>
    </div>`).join('');
    empty.hidden = visible.length > 0;
    count.textContent = `${visible.length} de ${items.length} quadros`;
    scaleTiles();
  }
  function scaleTiles() {
    const first = grid.querySelector('.tile__frame');
    if (!first) return;
    const s = first.clientWidth / 1080;
    grid.style.setProperty('--s', s.toFixed(4));
  }
  new ResizeObserver(scaleTiles).observe(grid);

  // ---- modal
  let modal = null, cur = -1;
  function openModal(idx) {
    cur = idx; const i = visible[idx]; if (!i) return;
    if (!modal) {
      modal = document.createElement('div'); modal.className = 'modal'; modal.setAttribute('role', 'dialog'); modal.setAttribute('aria-modal', 'true');
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.body.appendChild(modal);
    }
    const maxW = Math.min(window.innerWidth - 32, 720), maxH = window.innerHeight - 120;
    const s = Math.min(maxW / 1080, maxH / 1350);
    modal.innerHTML = `<div class="modal__frame" style="width:${1080 * s}px; height:${1350 * s}px;">${postHTML(i.struct, i.comp, i.bg, `transform:scale(${s});`)}</div>
      <div class="modal__bar"><button type="button" data-nav="-1" aria-label="Anterior">←</button><span><b>${i.structName} · ${i.comp} · ${NAME[i.bg]}</b> &nbsp;·&nbsp; ${i.desc}</span><button type="button" data-nav="1" aria-label="Próximo">→</button><button type="button" data-close="1">Fechar</button></div>`;
    modal.hidden = false;
    modal.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => openModal((cur + Number(b.dataset.nav) + visible.length) % visible.length)));
    modal.querySelector('[data-close]').addEventListener('click', closeModal);
    modal.querySelector('[data-close]').focus();
  }
  function closeModal() { if (modal) modal.hidden = true; cur = -1; }
  grid.addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openModal(Number(t.dataset.idx)); });
  grid.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const t = e.target.closest('.tile'); if (t) { e.preventDefault(); openModal(Number(t.dataset.idx)); } });
  document.addEventListener('keydown', e => {
    if (cur < 0) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowRight') openModal((cur + 1) % visible.length);
    if (e.key === 'ArrowLeft') openModal((cur - 1 + visible.length) % visible.length);
  });
  window.addEventListener('resize', () => { if (cur >= 0) openModal(cur); });

  sync();
})();
</script>
