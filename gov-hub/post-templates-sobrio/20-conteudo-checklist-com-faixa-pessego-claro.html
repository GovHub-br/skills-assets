<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist com faixa pêssego (claro)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800&display=swap">
<style>

  :root {
    --purple: #613EFF; --navy: #0A005A; --peach: #FFE7E1; --border-soft: #E9DFFF; --bg-subtle: #F8F9FA;
    --text-strong: #202020; --text-body: #2D3748; --text-muted: #666666;
    --ui-bg: #F4F2F8; --ui-panel: #FFFFFF; --ui-text: #1B1533; --ui-muted: #6A6483; --ui-line: #DDD8EA;
    --ui-accent: #613EFF; --ui-accent-text: #FFFFFF; --ui-shadow: 0 6px 24px rgba(10,0,90,.10);
    --font-ui: 'Reddit Sans', 'Open Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --font-head: 'Oswald', 'Arial Narrow', 'Reddit Sans', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ui-bg: #14101F; --ui-panel: #1E1830; --ui-text: #F1EEF9; --ui-muted: #A9A2C4; --ui-line: #2E2745;
      --ui-accent: #8C71FF; --ui-accent-text: #0A005A; --ui-shadow: 0 6px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --ui-bg: #14101F; --ui-panel: #1E1830; --ui-text: #F1EEF9; --ui-muted: #A9A2C4; --ui-line: #2E2745;
    --ui-accent: #8C71FF; --ui-accent-text: #0A005A; --ui-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font-family: var(--font-ui); font-size: 15px; padding: 0 16px 48px; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--ui-bg); margin-inline: -16px; padding: 16px 16px 12px; border-bottom: 1px solid var(--ui-line); }
  .top__row { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; max-width: 1480px; margin: 0 auto; }
  .top h1 { font-family: var(--font-head); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 22px; margin: 0; line-height: 1; }
  .top p { margin: 4px 0 0; color: var(--ui-muted); font-size: 13.5px; max-width: 80ch; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 12px auto 0; max-width: 1480px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .group > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ui-muted); margin-right: 4px; font-weight: 600; }
  .group button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ui-line); background: var(--ui-panel); color: var(--ui-text); cursor: pointer; }
  .group button[aria-pressed="true"] { background: var(--ui-accent); color: var(--ui-accent-text); border-color: var(--ui-accent); }
  .group button:focus-visible, .tile:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }
  .count { font-size: 13px; color: var(--ui-muted); margin-left: auto; align-self: center; font-variant-numeric: tabular-nums; }

  main { max-width: 1480px; margin: 20px auto 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px 18px; }
  .tile { background: var(--ui-panel); border-radius: 12px; box-shadow: var(--ui-shadow); padding: 10px; cursor: zoom-in; display: flex; flex-direction: column; gap: 8px; }
  .tile__frame { width: 100%; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 6px; position: relative; outline: 1px solid var(--ui-line); }
  .tile__frame .gh-post { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--s, .25)); }
  .tile__meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .tile__meta b { font-weight: 700; }
  .tile__meta span { color: var(--ui-muted); font-size: 12px; text-align: right; }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,0,30,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .modal[hidden] { display: none; }
  .modal__frame { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal__frame .gh-post { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .modal__bar { display: flex; gap: 12px; align-items: center; color: #fff; font-size: 14px; flex-wrap: wrap; justify-content: center; max-width: 720px; text-align: center; }
  .modal__bar button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; cursor: pointer; }

  /* ===================== quadro 1080×1350, variante sóbria ===================== */
  .gh-post { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; color: var(--text-body); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  .gh-shape { position: absolute; display: block; }

  /* capa e fechamento */
  .gh-cover__logo { position: absolute; left: 88px; top: 96px; height: 72px; width: auto; }
  .gh-cover__title { margin: 0; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; font-size: 104px; line-height: 1.04; letter-spacing: .005em; color: var(--navy); }
  .gh-cover__sub { margin: 0; font-size: 34px; line-height: 1.5; color: var(--text-body); }
  .gh-hint { position: absolute; left: 88px; bottom: 72px; display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: var(--navy); }

  /* abertura de seção */
  .gh-section__num { margin: 0 0 20px; font-size: 220px; font-weight: 800; line-height: 1; color: var(--navy); opacity: .45; }
  .gh-section__eyebrow { margin: 0 0 16px; text-transform: uppercase; letter-spacing: 4px; font-size: 24px; font-weight: 700; color: var(--navy); opacity: .7; }
  .gh-section__title { margin: 0; font-size: 80px; font-weight: 800; line-height: 1.12; color: var(--purple); }
  .gh-section__bar { position: absolute; left: 88px; right: 88px; height: 3px; background: var(--border-soft); }

  /* cabeçalho (print-header / slides-sober em escala de post) */
  .gh-band { position: absolute; top: 0; left: 88px; right: 88px; padding: 100px 0 32px; border-bottom: 3px solid var(--border-soft); }
  .gh-band__row { display: flex; align-items: center; gap: 28px; }
  .gh-band__num { font-size: 88px; font-weight: 800; line-height: 1; color: var(--navy); opacity: .45; min-width: 120px; }
  .gh-band__eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 21px; font-weight: 700; color: var(--navy); opacity: .7; margin-bottom: 10px; }
  .gh-band__title { margin: 0; color: var(--purple); font-size: 56px; font-weight: 800; line-height: 1.14; }

  /* corpo: y 340 a 1190 */
  .gh-body { position: absolute; left: 88px; right: 88px; top: 340px; bottom: 160px; overflow: hidden; }
  .gh-body h3 { margin: 0 0 26px; font-size: 42px; font-weight: 700; color: var(--navy); line-height: 1.25; }
  .gh-body p { margin: 0 0 30px; font-size: 38px; line-height: 1.5; color: var(--text-body); text-align: justify; hyphens: none; overflow-wrap: normal; }
  .gh-body ul { margin: 0; padding-left: 1.1em; font-size: 40px; }
  .gh-body li { font-size: 40px; line-height: 1.45; color: var(--text-body); margin-bottom: 30px; padding-left: 8px; }
  .gh-body li::marker { color: var(--purple); font-size: 1.1em; }
  .gh-body--center { display: flex; flex-direction: column; justify-content: center; padding-bottom: 60px; }

  /* cards (callout outline navy) */
  .gh-list { display: flex; flex-direction: column; gap: 24px; }
  .gh-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
  .gh-card { border: 2.5px solid var(--navy); border-radius: 18px; padding: 34px; }
  .gh-card--row { display: flex; align-items: center; gap: 30px; }
  .gh-badge { width: 92px; height: 92px; flex-shrink: 0; border: 2.5px solid var(--navy); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #fff; }
  .gh-badge img { width: 64px; height: 64px; }
  .gh-grid2 .gh-badge { margin-bottom: 22px; }
  .gh-body .gh-card__title { margin: 0 0 8px; font-size: 26px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; color: var(--text-strong); text-align: left; }
  .gh-body .gh-card__body { margin: 0; font-size: 31px; line-height: 1.4; color: var(--text-body); text-align: left; }

  /* fluxo vertical de 3 passos */
  .gh-flow { display: flex; flex-direction: column; align-items: stretch; }
  .gh-flow__arrow { display: flex; justify-content: center; padding: 10px 0; color: var(--purple); }
  .gh-card--hub { border-color: var(--purple); border-width: 3px; }
  .gh-card--hub .gh-badge { border-color: var(--purple); }

  /* tabela (print-table) */
  .gh-body .gh-caption { margin: 0 0 18px; font-size: 26px; font-weight: 700; color: var(--navy); text-align: left; }
  .gh-table { width: 100%; border-collapse: collapse; }
  .gh-table th { background: var(--navy); color: #fff; font-weight: 600; font-size: 29px; text-align: left; padding: 24px 24px; }
  .gh-table td { padding: 24px 24px; font-size: 29px; color: var(--text-body); border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .gh-table tr:last-child td { border-bottom: none; }
  .gh-table tbody tr:nth-child(even) td { background: var(--bg-subtle); }
  .gh-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ênfase */
  .gh-body .gh-kpi { margin: 0 0 28px; font-family: var(--font-head); font-weight: 700; font-size: 340px; line-height: 1; color: var(--purple); text-align: left; }
  .gh-body .gh-kpi-text { margin: 0; font-size: 54px; line-height: 1.35; font-weight: 500; color: var(--navy); text-align: left; }
  .gh-quote { margin: 0; border-left: 6px solid var(--purple); padding-left: 48px; }
  .gh-body .gh-quote p { margin: 0 0 36px; font-size: 60px; line-height: 1.38; font-weight: 500; color: var(--navy); text-align: left; }
  .gh-quote cite { font-style: normal; font-size: 30px; color: var(--text-muted); }
  .gh-question { margin: 0; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; font-size: 92px; line-height: 1.06; color: var(--navy); }

  /* convite */
  .gh-cta { display: inline-flex; align-items: center; gap: 16px; padding: 30px 52px; border-radius: 999px; background: var(--purple); color: #fff; font-size: 38px; font-weight: 700; }
  .gh-contact { display: flex; flex-direction: column; gap: 8px; margin-top: 56px; }
  .gh-contact b { font-size: 42px; font-weight: 700; color: var(--navy); }
  .gh-contact span { font-size: 34px; font-weight: 500; color: var(--text-muted); }

  /* rodapé: só contador + símbolo */
  .gh-footer { position: absolute; left: 88px; right: 88px; bottom: 64px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .gh-footer__page { font-size: 30px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .gh-footer__logo { height: 56px; width: auto; }

  /* fechamento */
  .gh-closing__contact { position: absolute; left: 88px; bottom: 300px; margin: 0; font-size: 38px; line-height: 1.55; color: var(--text-body); }
  .gh-closing__contact strong { color: var(--navy); font-weight: 700; }
  .gh-partners { position: absolute; left: 88px; bottom: 96px; display: flex; flex-direction: column; gap: 22px; }
  .gh-partners__label { font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  .gh-partners__logos { display: flex; align-items: center; gap: 56px; }
  .gh-partners__logos img { height: 64px; width: auto; }

  /* ============ v2: linguagem de post (menos relatório) ============ */
  /* pilha de conteúdo: título de post + corpo, de y 110 até acima do rodapé */
  .gh-stack { position: absolute; left: 88px; right: 88px; top: 112px; bottom: 170px; display: flex; flex-direction: column; }
  .gh-stack--center { justify-content: center; }
  .gh-eyebrow { margin: 0 0 22px; font-size: 24px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--purple); }
  .gh-title { margin: 0; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; font-size: 84px; line-height: 1.04; color: var(--navy); }
  .gh-lead { margin: 28px 0 0; font-size: 40px; line-height: 1.5; color: var(--text-body); }
  .gh-gap { flex: 1; min-height: 56px; max-height: 110px; }

  /* cabeçalho em faixa pêssego */
  .gh-peachhead { position: absolute; left: 0; right: 0; top: 0; height: 470px; background: var(--peach); padding: 112px 88px 0; }
  .gh-peachhead .gh-eyebrow { color: var(--navy); opacity: .75; }

  /* lista numerada */
  .gh-num-list { display: flex; flex-direction: column; gap: 84px; }
  .gh-num-item { display: grid; grid-template-columns: 160px 1fr; align-items: start; }
  .gh-num-item__n { font-family: var(--font-head); font-weight: 700; font-size: 104px; line-height: .9; color: var(--purple); }
  .gh-num-item__t { margin: 0 0 12px; font-size: 46px; font-weight: 700; line-height: 1.2; color: var(--navy); }
  .gh-num-item__d { margin: 0; font-size: 36px; line-height: 1.4; color: var(--text-body); }

  /* marcadores-círculo */
  .gh-dots { display: flex; flex-direction: column; gap: 70px; }
  .gh-dot-item { display: flex; gap: 32px; align-items: flex-start; font-size: 48px; line-height: 1.3; color: var(--text-body); }
  .gh-dot-item::before { content: ''; flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--purple); margin-top: 17px; }
  .gh-dot-item b { color: var(--navy); font-weight: 700; }

  /* cards pêssego (sem contorno) */
  .gh-pcards { display: flex; flex-direction: column; gap: 30px; }
  .gh-pcard { background: var(--peach); border-radius: 28px; padding: 52px 48px; display: flex; gap: 40px; align-items: center; }
  .gh-pcard img { width: 120px; height: 120px; flex-shrink: 0; }
  .gh-pcard__t { margin: 0 0 8px; font-size: 42px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .gh-pcard__d { margin: 0; font-size: 34px; line-height: 1.38; color: var(--text-body); }

  /* checklist */
  .gh-checks { display: flex; flex-direction: column; gap: 64px; }
  .gh-check { display: flex; gap: 30px; align-items: center; font-size: 48px; line-height: 1.3; font-weight: 500; color: var(--navy); }
  .gh-check svg { flex-shrink: 0; }

  /* linha do tempo */
  .gh-tl { position: relative; display: flex; flex-direction: column; gap: 84px; padding-left: 84px; }
  .gh-tl::before { content: ''; position: absolute; left: 19px; top: 24px; bottom: 60px; width: 6px; border-radius: 2px; background: var(--peach); }
  .gh-tl__item { position: relative; }
  .gh-tl__item::before { content: ''; position: absolute; left: -84px; top: 8px; width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; border: 9px solid var(--purple); background: #fff; }
  .gh-tl__when { margin: 0 0 12px; font-family: var(--font-head); font-weight: 700; font-size: 60px; line-height: 1; color: var(--purple); }
  .gh-tl__what { margin: 0; font-size: 38px; line-height: 1.4; color: var(--text-body); }

  /* barras */
  .gh-bars { display: flex; flex-direction: column; gap: 66px; }
  .gh-bar__row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .gh-bar__label { font-size: 40px; font-weight: 600; color: var(--navy); }
  .gh-bar__value { font-family: var(--font-head); font-weight: 700; font-size: 60px; color: var(--purple); font-variant-numeric: tabular-nums; }
  .gh-bar__track { height: 40px; border-radius: 20px; background: var(--peach); overflow: hidden; }
  .gh-bar__fill { height: 100%; border-radius: 20px; background: var(--purple); }

  /* números em grade */
  .gh-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; }
  .gh-stat { background: var(--peach); border-radius: 28px; padding: 52px 44px 56px; }
  .gh-stat__n { font-family: var(--font-head); font-weight: 700; font-size: 132px; line-height: 1; color: var(--purple); white-space: nowrap; }
  .gh-stat__l { margin: 20px 0 0; font-size: 34px; line-height: 1.35; color: var(--navy); }

  /* ranking em pílulas */
  .gh-rank { display: flex; flex-direction: column; gap: 14px; }
  .gh-rank__row { display: flex; align-items: center; gap: 28px; padding: 28px 48px 28px 40px; border-radius: 999px; background: var(--peach); }
  .gh-rank__row:nth-child(even) { background: transparent; }
  .gh-rank__pos { font-family: var(--font-head); font-weight: 700; font-size: 48px; color: var(--purple); width: 60px; }
  .gh-rank__name { flex: 1; font-size: 40px; font-weight: 600; color: var(--navy); }
  .gh-rank__val { font-family: var(--font-head); font-weight: 700; font-size: 56px; color: var(--navy); font-variant-numeric: tabular-nums; }

  /* antes x depois */
  .gh-compare { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 36px; }
  .gh-compare__label { font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
  .gh-compare__n { font-family: var(--font-head); font-weight: 700; font-size: 260px; line-height: 1; }
  .gh-compare__u { font-size: 44px; font-weight: 600; margin-top: 8px; }

  /* destaque em bloco pêssego */
  .gh-highlight { margin-top: 72px; background: var(--peach); border-radius: 28px; padding: 48px 52px; font-family: var(--font-head); font-weight: 700; text-transform: uppercase; font-size: 68px; line-height: 1.1; color: var(--navy); }

  /* ============ v3: referência Behance (banco digital) ============ */
  .r-light { background: #F2F1F6 !important; }
  .r-purple { background: var(--purple) !important; color: #fff; }
  .r-h { margin: 0; font-family: var(--font-ui); font-weight: 400; letter-spacing: -0.025em; line-height: 1.06; }
  .r-h b { font-weight: 800; }
  .r-txt { margin: 0; font-family: var(--font-ui); font-weight: 400; letter-spacing: -0.01em; line-height: 1.3; }
  .r-abs { position: absolute; }
  .r-tonal { position: absolute; border-radius: 50%; }
  .r-logo { position: absolute; height: 46px; width: auto; }
  .r-pill { display: inline-flex; align-items: center; gap: 18px; height: 84px; padding: 0 40px 0 14px; border-radius: 999px; font-size: 27px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .r-pill__ico { width: 56px; height: 56px; border-radius: 50%; border: 3px solid currentColor; display: flex; align-items: center; justify-content: center; }
  .r-pill--bleed { border-radius: 999px 0 0 999px; }
  .r-tag { display: inline-flex; align-items: center; gap: 10px; padding: 8px 22px; border-radius: 999px; font-size: 24px; font-weight: 600; white-space: nowrap; }

  /* card-pasta */
  .r-folder { position: relative; background: var(--navy); border-radius: 30px; padding: 40px 40px 44px; }
  .r-folder__tab { position: absolute; top: -46px; right: 0; width: 56%; height: 80px; background: var(--navy); border-radius: 26px 26px 0 0; }
  .r-folder__strip { position: absolute; top: -58px; right: 40px; width: 40%; height: 60px; background: var(--peach); border-radius: 12px 12px 0 0; }
  .r-folder__head { position: relative; margin: 0 0 34px; color: #fff; font-size: 58px; font-weight: 700; letter-spacing: -0.02em; }
  .r-folder__head small { font-size: 36px; font-weight: 400; letter-spacing: 0; }
  .r-sheet { position: relative; background: #fff; border-radius: 22px; padding: 38px 40px 40px; color: var(--navy); }
  .r-sheet__row { display: flex; justify-content: space-between; align-items: center; }
  .r-mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: -0.01em; }

  /* busca */
  .r-search { display: flex; align-items: center; gap: 26px; background: #fff; border-radius: 999px; height: 132px; padding: 0 48px; box-shadow: 0 30px 60px rgba(10,0,90,.25); color: var(--navy); font-size: 42px; font-weight: 500; }
  .r-caret { display: inline-block; width: 4px; height: 50px; background: var(--purple); margin-left: -18px; }
  .r-results { margin-top: 22px; background: #fff; border-radius: 30px; padding: 16px 0; box-shadow: 0 30px 60px rgba(10,0,90,.25); }
  .r-result { display: flex; align-items: center; justify-content: space-between; padding: 22px 44px; font-size: 32px; color: var(--navy); }
  .r-result + .r-result { border-top: 2px solid #EFECF8; }
  .r-result span { font-size: 24px; font-weight: 700; letter-spacing: .06em; color: var(--purple); }

  /* notificações */
  .r-toast { display: flex; align-items: center; gap: 26px; background: #fff; border-radius: 28px; padding: 28px 34px; box-shadow: 0 24px 50px rgba(10,0,90,.22); }
  .r-toast__t { font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .r-toast__s { font-size: 24px; color: var(--text-muted); margin-top: 4px; }

  /* bloco com recorte para a logo */
  .r-block { position: absolute; border-radius: 40px; overflow: hidden; }
  .r-notch { position: absolute; left: 0; bottom: 0; padding: 26px 40px 0 0; border-radius: 0 40px 0 0; }
  .r-notch::before, .r-notch::after { content: ''; position: absolute; width: 40px; height: 40px; background: radial-gradient(circle at 100% 0, transparent 39.5px, var(--notch-bg) 40px); }
